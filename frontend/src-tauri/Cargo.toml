[package]
name = "dv-launcher-app"
version = "3.0.0"
description = "Digital Vigital Minecraft Launcher powered by Tauri v2 and Svelte"
authors = ["Digital Vigital"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["lib"]

[[bin]]
name = "dv-launcher-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
dv_launcher = { package = "dv-launcher", path = "../..", default-features = false }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.1"
tauri-plugin-dialog = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rfd = "0.15"
open = "5.3"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
