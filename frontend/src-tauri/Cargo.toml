[package]
name = "dv-launcher-app"
version = "1.2.1"
description = "Digital Vigital Minecraft Launcher powered by Tauri v2 and Svelte"
authors = ["Digital Vigital"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
dv_launcher = { package = "dv-launcher", path = "../..", default-features = false }
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.1"
tauri-plugin-dialog = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
