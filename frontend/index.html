<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/64x64.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/128x128.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/512x512.png" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Vigital Launcher</title>
    <script>
      // Completely disable right-click context menu across all modes immediately
      window.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, true);
      document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, true);
    </script>
    <!-- Preconnect & High-Readability Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body oncontextmenu="return false;" class="bg-[#08090d] text-[#f3f4f6] overflow-hidden select-none font-sans antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
