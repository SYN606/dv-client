[package]
name = "dv-launcher"
version = "1.2.0"
edition = "2021"
authors = ["Digital Vigital"]
description = "High-performance, privacy-first desktop Minecraft launcher powered by Rust and Slint"
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "dv_launcher"
path = "src/lib.rs"

[[bin]]
name = "dv-launcher"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18.1" }
tokio = { version = "1.44", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
regex = "1.11"
dirs = "6.0"
uuid = { version = "1.15", features = ["v4"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
url = "2.5"
keyring = { version = "4.2.0" }
dunce = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
tempfile = "3.17"

[build-dependencies]
slint-build = "1.18.1"
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
