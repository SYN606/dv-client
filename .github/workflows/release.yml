name: Release Build & Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-packages:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fontconfig libfontconfig1-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev

      - name: Build AppImage, DEB, and RPM Packages
        run: |
          ./packaging/build_all.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*.*

  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Windows Installer (Any Drive Selection)
        run: |
          makensis packaging\windows\DigitalVigital.nsi

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
